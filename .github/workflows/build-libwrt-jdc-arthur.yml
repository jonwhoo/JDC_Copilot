name: JDCloud Arthur Build

on:
  workflow_dispatch:
    inputs:
      repo_commit:
        description: "LiBwrt/openwrt-6.x commit hash（可选）"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4

      - name: Prepare build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3 python3-pip \
            python3-setuptools rsync swig unzip zlib1g-dev curl wget \
            ccache

          sudo systemctl stop mysql || true
          sudo systemctl stop apache2 || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Clone LibWrt source
        run: |
          git config --global advice.detachedHead false
          git config --global http.postBuffer 524288000
          git config --global http.maxRequestBuffer 1000M

          for i in {1..3}; do
            git clone --depth 1 -b main-nss https://github.com/LiBwrt/openwrt-6.x.git openwrt && break
            echo "Clone failed, retrying in 5 seconds..."
            sleep 5
          done

          if [ ! -d "openwrt" ]; then
            echo "Clone failed after 3 attempts."
            exit 1
          fi

          cd openwrt
          if [ -n "${{ github.event.inputs.repo_commit }}" ]; then
            git fetch origin ${{ github.event.inputs.repo_commit }}
            git checkout ${{ github.event.inputs.repo_commit }}
          fi

      - name: Copy .config
        run: |
          cd openwrt
          cp ../arthur.config .config

      - name: Run diy-part1.sh (feeds)
        run: |
          chmod +x diy-part1.sh
          cd openwrt
          ../diy-part1.sh

      - name: Update & install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Run diy-part2.sh (system tweaks)
        run: |
          chmod +x diy-part2.sh
          cd openwrt
          ../diy-part2.sh

      - name: Load config & download packages
        run: |
          cd openwrt
          make defconfig
          make download -j$(nproc)

      - name: Build firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: JDCloud-Arthur-LibWrt-Firmware
          path: openwrt/bin/targets/

      - name: Upload final .config
        uses: actions/upload-artifact@v4
        with:
          name: JDCloud-Arthur-.config
          path: openwrt/.config

      - name: Set release date
        run: echo "RELEASE_DATE=$(date +'%Y%m%d-%H%M')" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: "Arthur-${{ env.RELEASE_DATE }}"
          name: "JDCloud Arthur 固件发布 ${{ env.RELEASE_DATE }}"
          body: |
            自动构建的京东云亚瑟固件（LibWrt main-nss）
            - OpenClash 默认配置（含订阅模板）
            - Passwall 默认配置模板
            - SSR+ 默认配置模板
            - SmartDNS 分流方案
            - TurboACC + NSS 加速
            - 已删除 rclone，固件更轻更稳
            - 支持自动 DNS 分流、自动代理、自动加速

          files: |
            openwrt/bin/targets/*/*/*.bin
            openwrt/bin/targets/*/*/*.manifest
